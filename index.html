<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data:; connect-src 'self' https://api.coingecko.com https://api.frankfurter.dev; base-uri 'none'; form-action 'none'; object-src 'none'">
  <meta name="referrer" content="no-referrer">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Tide Table · Monthly</title>
  <meta name="description" content="A tracker for a monthly buying plan, November 2026 to October 2027. Type your monthly amount and tick off each order. Everything stays in your browser.">
  <meta name="color-scheme" content="light dark">
  <meta name="apple-mobile-web-app-title" content="Tide Table">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icon.svg" type="image/svg+xml">
  <script src="js/boot-theme.js?v=2.1.0"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Andika:ital,wght@0,400;0,700;1,400&family=Mali:wght@600;700&display=swap">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+Thai:wght@400;700&text=%E0%B8%BF&display=swap">
  <link rel="stylesheet" href="css/tokens.css?v=2.1.0">
  <link rel="stylesheet" href="css/book.css?v=2.1.0">
  <link rel="stylesheet" href="css/app.css?v=2.1.0">
  <link rel="stylesheet" href="css/friends.css?v=2.1.0">
  <link rel="stylesheet" href="css/mix.css?v=2.1.0">
  <script type="module" src="js/main.js?v=2.1.0"></script>
</head>
<body>
  <a class="bk-skip skip" href="#main">Skip to the page</a>

  <div class="bk-shell">
    <div data-rail hidden></div>
    <div class="bk-main-col">
      <div data-topbar hidden></div>
      <div class="ttm-strip">
        <div class="clock" data-clock aria-label="Bangkok time"></div>
        <div class="fresh" data-fresh></div>
      </div>
      <main id="main" class="bk-main" tabindex="-1">
        <div data-older hidden></div>
        <section data-view="setup" hidden></section>
        <section data-view="today" hidden></section>
        <section data-view="fields" hidden></section>
        <section data-view="field" hidden></section>
        <section data-view="company" hidden></section>
        <section data-view="stocks" hidden></section>
        <section data-view="split" hidden></section>
        <section data-view="year" hidden></section>
        <section data-view="money" hidden></section>
        <section data-view="holdings" hidden></section>
        <section data-view="rules" hidden></section>
        <section data-view="settings" hidden></section>
        <section data-view="mix" hidden></section>
        <div class="loading" data-boot role="status">
          <p>Opening the tide table.</p>
          <noscript><p>This tracker needs JavaScript. Turn it on for this page and reload.</p></noscript>
        </div>
      </main>
      <footer class="bk-foot" data-foot>
        <p>Tide Table shows facts from the past and today. It is not personal advice and never says buy, sell or hold. Check that any choice fits your own money, goals and taxes.</p>
      </footer>
    </div>
  </div>

  <div data-tabbar hidden></div>

  <div class="toasts" data-toasts></div>
  <div class="sr-live visually-hidden" data-sr-live aria-live="polite"></div>
</body>
</html>
